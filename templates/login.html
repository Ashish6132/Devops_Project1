<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - College Complaint Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg,
                        #123c75, #3498db);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px
                        rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #123c75;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #3498db;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #123c75;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2563aa;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #123c75;
            text-decoration: none;
        }

        .error {
            color: #c0392b;
            text-align: center;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>College Complaint System</h2>

        <p class="subtitle">
            Student & Admin Login
        </p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">

            <label for="role">Login As</label>
            <select name="role" id="role" required>
                <option value="student">Student</option>
                <option value="admin">Admin</option>
            </select>

            <label for="username">
                Student ID / Username
            </label>

            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Enter username"
                   required>

            <label for="password">Password</label>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="links">
            <p>New Student?
                <a href="/register">Register Here</a>
            </p>

            <p style="margin-top:12px;">
                <a href="/">Back to Home</a>
            </p>
        </div>

    </div>

</body>
</html>
