<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - College Complaint Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(
                135deg,
                #123c75,
                #3498db
            );

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;

            box-shadow: 0 10px 30px
                        rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #123c75;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #3498db;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #123c75;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2563aa;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links p {
            margin-top: 12px;
        }

        .links a {
            color: #123c75;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .error {
            color: #c0392b;
            background: #fdecea;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .success {
            color: #155724;
            background: #d4edda;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 5px;
            background: transparent;
            color: #123c75;
            font-size: 13px;
        }

        .toggle-password:hover {
            background: transparent;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 25px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>College Complaint System</h2>

        <p class="subtitle">
            Student & Admin Login
        </p>

        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="error" role="alert">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <!-- LOGIN FORM -->

        <form method="POST"
              action="{{ url_for('login') }}">

            <!-- EMAIL -->

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter registered email"
                autocomplete="email"
                required
            >

            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword()">
                    Show
                </button>

            </div>

            <!-- LOGIN BUTTON -->

            <button type="submit">
                Login
            </button>

        </form>

        <!-- LINKS -->

        <div class="links">

            <p>
                New Student?
                <a href="{{ url_for('register') }}">
                    Register Here
                </a>
            </p>

            <p>
                <a href="{{ url_for('home') }}">
                    Back to Home
                </a>
            </p>

        </div>

    </div>

    <!-- JAVASCRIPT -->

    <script>
        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".toggle-password");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }
        }
    </script>

</body>
</html>
